name: release

# Tag a release (v1.2.3) and this publishes ghcr.io/openpak/xb-account:1.2.3, :1.2 and :latest for
# amd64 and arm64. Runs only on pushed v*.*.* tags (or manually) on the OpenPak self-hosted
# runner (podman + qemu binfmt), so it costs no GitHub-hosted minutes.
# The module github.com/openpak/xb-common is private: the build reads it with this job's
# GITHUB_TOKEN through a netrc build secret (xb-common's Actions access is set to
# "accessible from repositories in the organization"). The token never enters the image.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v5
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      - name: Test (Go container, GOWORK=off)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf 'machine github.com login x-access-token password %s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/netrc"
          podman run --rm -v "$PWD:/src:Z" -v "$RUNNER_TEMP/netrc:/root/.netrc:ro,Z" -w /src \
            -e GOWORK=off -e GOFLAGS=-buildvcs=false -e 'GOPRIVATE=github.com/openpak/*' \
            docker.io/library/golang:1.26-bookworm sh -ec '
              go vet ./...
              go test -race -count=1 ./...'
      # Job-scoped login, never the runner user's own. The runner context is not
      # available in job-level env, so each step that touches the registry sets it.
      - env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          set -e
          IMG="ghcr.io/${{ github.repository }}"
          case "${GITHUB_REF_NAME}" in v*) VER="${GITHUB_REF_NAME#v}";; *) VER="";; esac
          podman manifest rm "$IMG:build" 2>/dev/null || true
          podman build --secret id=netrc,src="$RUNNER_TEMP/netrc" --platform linux/amd64,linux/arm64 --manifest "$IMG:build" .
          TAGS="latest"; [ -n "$VER" ] && TAGS="$TAGS $VER $(echo "$VER" | cut -d. -f1,2)"
          for t in $TAGS; do podman manifest push --all "$IMG:build" "docker://$IMG:$t"; done
          podman manifest rm "$IMG:build"
          echo "pushed $IMG: $TAGS"
      - name: Clear scratch and credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch" "$RUNNER_TEMP/netrc" "$RUNNER_TEMP/auth.json"
